<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 70" fill="none">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Isometric Prism Icon with Layer Lines -->
  <g transform="translate(12, 8)">
    <!-- Base Layer -->
    <path d="M26 4 L48 16 L26 28 L4 16 Z" fill="url(#prismGrad)" opacity="0.3"/>
    <!-- Middle Layer Lines (3D Print Slices) -->
    <path d="M4 22 L26 34 L48 22" stroke="url(#prismGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M4 29 L26 41 L48 29" stroke="url(#prismGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M4 36 L26 48 L48 36" stroke="url(#prismGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
    
    <!-- Top Face -->
    <polygon points="26,6 46,17 26,28 6,17" fill="url(#prismGrad)"/>
    <!-- Vertical Connectors -->
    <line x1="6" y1="17" x2="6" y2="36" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>
    <line x1="46" y1="17" x2="46" y2="36" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <line x1="26" y1="28" x2="26" y2="48" stroke="#3b82f6" stroke-width="2.5" filter="url(#neonGlow)"/>
    <!-- Hotend / Nozzle indicator dot -->
    <circle cx="26" cy="6" r="3.5" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- Typography -->
  <text x="76" y="38" font-family="'Syne', 'Inter', sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">
    PRISMA<tspan fill="#06b6d4" font-weight="900">3D</tspan>
  </text>
  <text x="78" y="52" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="#94a3b8" letter-spacing="3.5">
    STUDIO &amp; PRODUÇÃO
  </text>
</svg>
